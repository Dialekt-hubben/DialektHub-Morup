services:
    db:
        image: mysql:latest
        container_name: mysql-container
        environment:
            MYSQL_ROOT_PASSWORD: rootpassword
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
        ports:
            - "3306:3306"
        volumes:
            - db_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 10s
            timeout: 5s
            retries: 5
    migrator:
        build:
            context: .
            dockerfile: Dockerfile
            target: builder
            args:
                DATABASE_URL: ${DATABASE_URL}
                MYSQL_USER: ${MYSQL_USER}
                MYSQL_PASSWORD: ${MYSQL_PASSWORD}
                MYSQL_HOST: ${MYSQL_HOST}
                MYSQL_DATABASE: ${MYSQL_DATABASE}
                BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
                S3_ACCESS_KEY: ${S3_ACCESS_KEY}
                S3_SECRET_KEY: ${S3_SECRET_KEY}
                S3_REGION: ${S3_REGION}
                S3_BUCKET_NAME: ${S3_BUCKET_NAME}
                S3_ENDPOINT: ${S3_ENDPOINT}
                BETTER_AUTH_BASE_URL: ${BETTER_AUTH_BASE_URL:-http://localhost:3000}
        image: migrator-image
        env_file: .env.production
        environment:
            NODE_ENV: production
        command: npx tsx src/Drizzle/migrate.ts
        depends_on:
            db:
                condition: service_healthy
    Garage:
        image: dxflrs/garage:v2.5.0
        # network_mode: "host"
        restart: unless-stopped
        ports:
            - "3900:3900"
        volumes:
            - ./garage/config/garage.toml:/etc/garage.toml:ro
            - ./garage/meta:/var/lib/garage/meta
            - ./garage/data:/var/lib/garage/data
        environment:
            - TZ=Europe/Stockholm
    Morpekanska:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                DATABASE_URL: ${DATABASE_URL}
                MYSQL_USER: ${MYSQL_USER}
                MYSQL_PASSWORD: ${MYSQL_PASSWORD}
                MYSQL_HOST: ${MYSQL_HOST}
                MYSQL_DATABASE: ${MYSQL_DATABASE}
                BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
                S3_ACCESS_KEY: ${S3_ACCESS_KEY}
                S3_SECRET_KEY: ${S3_SECRET_KEY}
                S3_REGION: ${S3_REGION}
                S3_BUCKET_NAME: ${S3_BUCKET_NAME}
                S3_ENDPOINT: ${S3_ENDPOINT}
                BETTER_AUTH_BASE_URL: ${BETTER_AUTH_BASE_URL:-http://localhost:3000}
        image: morpekanska-image
        container_name: morpekanska-container
        env_file: .env.production
        environment:
            NODE_ENV: production
            PORT: "3000"
        ports:
            - "3000:3000"
        depends_on:
            # S3Ninja:
            #     condition: service_healthy
            migrator:
                condition: service_completed_successfully
        command: ["node", "server.js"]
        restart: unless-stopped

volumes:
    db_data:
